name: Scheduled reminders

on:
  schedule:
    # The dispatch endpoint evaluates each reminder kind independently against
    # its own "no earlier than" local hour (7am for Bodyweight/Measurement,
    # 9pm for Creatine) and dedupes delivery per Local Calendar Date in KV, so
    # it is safe to call it on a schedule that only loosely brackets both
    # windows: whichever kinds are due by the time a run actually executes
    # get sent, and GitHub's scheduled runs are best-effort and have been
    # observed landing 1-3 hours after every candidate slot below (sometimes
    # coalesced into a single run for the whole day).
    #   7am America/New_York -> 11:00 UTC (DST) / 12:00 UTC (standard)
    #   9pm America/New_York -> 01:00 UTC (DST) / 02:00 UTC (standard), plus
    #     an earlier 00:00 UTC slot as extra delay buffer before midnight
    - cron: '0,15,30,45 0,1,2,11,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Evaluate today's reminders outside their local time windows
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: scheduled-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due reminders
        env:
          DISPATCH_URL: ${{ secrets.REMINDER_DISPATCH_URL }}
          DISPATCH_TOKEN: ${{ secrets.REMINDER_DISPATCH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ]; then
            DISPATCH_URL="${DISPATCH_URL}?force=true"
          fi
          # Do NOT follow redirects: a 3xx here means the request was diverted
          # (edge redirect or Access login) before reaching the JSON dispatcher.
          # Capture status + sanitized redirect target so a 302 is diagnosable
          # instead of being silently swallowed as a "success".
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code} %{redirect_url}' \
            --request POST \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$DISPATCH_URL")"
          http_code="${status%% *}"
          redirect_url="${status#* }"
          # Strip the query string (repo is public); keep scheme/host/path only.
          redirect_target="${redirect_url%%\?*}"
          echo "HTTP status: ${http_code}"
          if [ -n "$redirect_target" ]; then
            echo "Redirect target (query stripped): ${redirect_target}"
          fi
          echo "Response body:"
          cat "$body"
          echo
          # Only a 2xx JSON response from the dispatcher counts as success.
          case "$http_code" in
            2*) exit 0 ;;
            *)  echo "::error::Dispatch did not reach the function (HTTP ${http_code})"; exit 1 ;;
          esac
